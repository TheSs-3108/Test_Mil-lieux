<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets — Mil Lieux</title>
    <meta name="description" content="Les réalisations de l'agence d'architecture Mil Lieux à Nancy : enseignement, santé, équipements publics, logements.">
    <link rel="stylesheet" href="../assets/styles/style_global.css">
    <link rel="stylesheet" href="../assets/styles/nav_barre.css">
    <link rel="stylesheet" href="../assets/styles/projet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body data-root="../">

    <!-- v17 : filtres = vrais boutons (clavier, toucher) ; logique dans assets/scripts/projet.js -->
    <div class="filters-bar" role="search" aria-label="Filtrer les projets">
        <div class="dropdown dropdown-category" data-group="category">
            <button class="dropbtn" type="button" aria-expanded="false" aria-controls="filtre-categorie">Catégories ▾</button>
            <div class="dropdown-content" id="filtre-categorie">
                <button type="button" class="filter-item active" aria-pressed="true" data-value="all">Tous les projets</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="enseignement">Enseignement</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="public">Équipement public</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="industriel">Industriel</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="logements">Logements</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="prive">Privé</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="sante">Santé</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="tertiaire">Tertiaire &amp; Commercial</button>
            </div>
        </div>
        <div class="dropdown dropdown-status" data-group="status">
            <button class="dropbtn" type="button" aria-expanded="false" aria-controls="filtre-statut">Statut ▾</button>
            <div class="dropdown-content" id="filtre-statut">
                <button type="button" class="filter-item active" aria-pressed="true" data-value="all">Tous les statuts</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="en-cours">En cours</button>
                <button type="button" class="filter-item" aria-pressed="false" data-value="termine">Terminé</button>
            </div>
        </div>
        <a class="vue-lien" href="carte.html" aria-label="Voir la carte des projets"><svg class="vue-lien__ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zm0 0v13.5m6-11v13.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="vue-lien__txt">Voir la carte</span></a>
    </div>

    <!-- Tuiles générées par assets/scripts/projet-loader.js à partir de assets/data/projets-data.js.
         Chaque projet a sa propre page dans pages/projets/ -->
    <main class="container" id="gallery">
        <p class="projets-loading">Chargement des projets…</p>
    </main>

    <script src="../assets/data/site-data.js"></script>
    <script src="../assets/scripts/site-shell.js"></script>
    <script src="../assets/scripts/cursor_script.js"></script>
    <script src="../assets/scripts/nav_barre.js"></script>
    <script src="../assets/data/projets-data.js"></script>
    <script src="../assets/scripts/projet-loader.js"></script>
    <script src="../assets/scripts/projet.js"></script>

</body>
</html>
