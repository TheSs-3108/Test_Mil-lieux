<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets — Mil Lieux</title>
    <link rel="stylesheet" href="../assets/styles/style_global.css">
    <link rel="stylesheet" href="../assets/styles/nav_barre.css">
    <link rel="stylesheet" href="../assets/styles/projet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body data-root="../">

    <div class="filters-bar">
        <div class="dropdown dropdown-category">
            <button class="dropbtn">catégories ▾</button>
            <div class="dropdown-content">
                <div class="filter-item active" onclick="filterCategory('all', this)">Tous les projets</div>
                <div class="filter-item" onclick="filterCategory('enseignement', this)">Enseignement</div>
                <div class="filter-item" onclick="filterCategory('public', this)">Équipement public</div>
                <div class="filter-item" onclick="filterCategory('industriel', this)">Industriel</div>
                <div class="filter-item" onclick="filterCategory('logements', this)">Logements</div>
                <div class="filter-item" onclick="filterCategory('prive', this)">Privé</div>
                <div class="filter-item" onclick="filterCategory('sante', this)">Santé</div>
                <div class="filter-item" onclick="filterCategory('tertiaire', this)">Tertiaire & Commercial</div>
            </div>
        </div>
        <div class="dropdown dropdown-status">
            <button class="dropbtn">Statut ▾</button>
            <div class="dropdown-content">
                <div class="filter-item active" onclick="filterStatus('all', this)">Tous les statuts</div>
                <div class="filter-item" onclick="filterStatus('en-cours', this)">En cours</div>
                <div class="filter-item" onclick="filterStatus('termine', this)">Terminé</div>
            </div>
        </div>
    </div>

    <!-- Tuiles générées par assets/scripts/projet-loader.js à partir de assets/data/projets-data.js.
         Chaque projet a sa propre page dans pages/projets/ -->
    <div class="container" id="gallery">
        <p class="projets-loading">Chargement des projets…</p>
    </div>

    <script src="../assets/data/site-data.js"></script>
    <script src="../assets/scripts/site-shell.js"></script>
    <script src="../assets/scripts/cursor_script.js"></script>
    <script src="../assets/scripts/nav_barre.js"></script>
    <script src="../assets/data/projets-data.js"></script>
    <script src="../assets/scripts/projet-loader.js"></script>
    <script src="../assets/scripts/projet.js"></script>

</body>
</html>
